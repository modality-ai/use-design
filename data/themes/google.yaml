$description: Material Design 3 — colorful, rounded, playful.
$extensions:
  use-design.theme:
    name: Google
    version: alpha
color:
  $type: color
  bg:
    primary:
      $value:
        colorSpace: srgb
        components:
          - 1
          - 1
          - 1
        hex: "#ffffff"
      $extensions:
        use-design.mode:
          dark:
            colorSpace: srgb
            components:
              - 0.106
              - 0.106
              - 0.122
            hex: "#1b1b1f"
    secondary:
      $value:
        colorSpace: srgb
        components:
          - 0.949
          - 0.949
          - 0.969
        hex: "#f2f2f7"
    surface:
      $value:
        colorSpace: srgb
        components:
          - 0.949
          - 0.949
          - 0.969
        hex: "#f2f2f7"
      $extensions:
        use-design.mode:
          dark:
            colorSpace: srgb
            components:
              - 0.169
              - 0.169
              - 0.188
            hex: "#2b2b30"
    surface-alt:
      $value:
        colorSpace: srgb
        components:
          - 1
          - 1
          - 1
        hex: "#ffffff"
  text:
    primary:
      $value:
        colorSpace: srgb
        components:
          - 0.122
          - 0.122
          - 0.122
        hex: "#1f1f1f"
      $extensions:
        use-design.mode:
          dark:
            colorSpace: srgb
            components:
              - 0.89
              - 0.89
              - 0.89
            hex: "#e3e3e3"
    secondary:
      $value:
        colorSpace: srgb
        components:
          - 0.267
          - 0.278
          - 0.275
        hex: "#444746"
    tertiary:
      $value:
        colorSpace: srgb
        components:
          - 0.455
          - 0.467
          - 0.459
        hex: "#747775"
    on-dark:
      $value:
        colorSpace: srgb
        components:
          - 0.89
          - 0.89
          - 0.89
        hex: "#e3e3e3"
  accent:
    $value:
      colorSpace: srgb
      components:
        - 0.102
        - 0.451
        - 0.91
      hex: "#1a73e8"
  link:
    $value:
      colorSpace: srgb
      components:
        - 0.102
        - 0.451
        - 0.91
      hex: "#1a73e8"
  link-dark:
    $value:
      colorSpace: srgb
      components:
        - 0.541
        - 0.706
        - 0.973
      hex: "#8ab4f8"
  btn-active:
    $value:
      colorSpace: srgb
      components:
        - 0.824
        - 0.89
        - 0.988
      hex: "#d2e3fc"
  shadow:
    $value:
      colorSpace: srgb
      components:
        - 0
        - 0
        - 0
      alpha: 0.12
      hex: "#000000"
  nav-bg:
    $value:
      colorSpace: srgb
      components:
        - 1
        - 1
        - 1
      hex: "#ffffff"
    $extensions:
      use-design.mode:
        dark:
          colorSpace: srgb
          components:
            - 0.106
            - 0.106
            - 0.122
          hex: "#1b1b1f"
  border:
    $value:
      colorSpace: srgb
      components:
        - 0
        - 0
        - 0
      alpha: 0.08
      hex: "#000000"
  input:
    bg:
      $value:
        colorSpace: srgb
        components:
          - 1
          - 1
          - 1
        hex: "#ffffff"
    border:
      $value:
        colorSpace: srgb
        components:
          - 0
          - 0
          - 0
        alpha: 0.12
        hex: "#000000"
font:
  $type: typography
  display:
    $value:
      fontFamily: '"Google Sans", "Roboto", "Helvetica Neue", Arial, sans-serif'
  body:
    $value:
      fontFamily: '"Roboto", "Helvetica Neue", Arial, sans-serif'
radius:
  sm:
    $type: dimension
    $value:
      value: 8
      unit: px
  md:
    $type: dimension
    $value:
      value: 12
      unit: px
  lg:
    $type: dimension
    $value:
      value: 16
      unit: px
  pill:
    $type: dimension
    $value:
      value: 100
      unit: px
spacing:
  $type: dimension
  xs:
    $value:
      value: 4
      unit: px
  sm:
    $value:
      value: 8
      unit: px
  md:
    $value:
      value: 16
      unit: px
  lg:
    $value:
      value: 32
      unit: px
  xl:
    $value:
      value: 64
      unit: px
  gutter:
    $value:
      value: 24
      unit: px
  section:
    $value:
      value: 80
      unit: px
